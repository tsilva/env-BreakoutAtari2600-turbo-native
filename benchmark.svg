<svg xmlns="http://www.w3.org/2000/svg" width="4090" height="700" viewBox="0 0 4090 700" role="img" aria-labelledby="title description">
<title id="title">Environment throughput by environment count</title>
<desc id="description">Side-by-side upstream and candidate bars show median steps per second on a linear axis starting at zero. Speedups use shape-local paired ratios.</desc>
<rect width="100%" height="100%" fill="#0d1117"/>
<g font-family="monospace" fill="#acbde1">
<text x="80" y="60" font-size="32">Throughput by environment count</text>
<text x="80" y="98" font-size="20">Median steps per second (SPS); higher is faster</text>
<rect x="140" y="155" width="20" height="20" fill="#acbde1"/><text x="172" y="172" font-size="20">Stable Retro 1.0.1</text>
<rect x="860" y="155" width="20" height="20" fill="#ffcc22"/><text x="892" y="172" font-size="20">BreakoutAtari2600-turbo 0.5.15</text>
<path d="M140 500.000 H4010" stroke="#606975" stroke-opacity="0.4"/><text x="124" y="506.000" text-anchor="end" font-size="18">0</text>
<path d="M140 400.000 H4010" stroke="#606975" stroke-opacity="0.4"/><text x="124" y="406.000" text-anchor="end" font-size="18">200,000</text>
<path d="M140 300.000 H4010" stroke="#606975" stroke-opacity="0.4"/><text x="124" y="306.000" text-anchor="end" font-size="18">400,000</text>
<path d="M140 200.000 H4010" stroke="#606975" stroke-opacity="0.4"/><text x="124" y="206.000" text-anchor="end" font-size="18">600,000</text>
