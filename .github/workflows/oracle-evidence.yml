name: Stable Retro Turbo oracle evidence

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Exact 40-character candidate commit SHA on main"
        required: true
        type: string

permissions:
  attestations: write
  contents: read
  id-token: write

concurrency:
  group: oracle-evidence-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  evidence:
    name: Generate attested sole-oracle receipt
    runs-on: macos-15
    environment: oracle
    steps:
      - name: Validate immutable ref
        run: '[[ "${{ inputs.ref }}" =~ ^[0-9a-f]{40}$ ]]'

      - name: Checkout exact candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.ref }}

      - name: Require current main candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "${{ inputs.ref }}"
          test "$(git rev-parse origin/main)" = "${{ inputs.ref }}"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.13"

      - name: Install locked validation environment
        run: uv sync --locked --extra dev

      - name: Prepare pinned provider and lawful ROM
        env:
          BREAKOUT_ROM_BASE64: ${{ secrets.BREAKOUT_ROM_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BREAKOUT_ROM_BASE64"
          mkdir -p "$RUNNER_TEMP/retro-data/stable/Breakout-Atari2600-v0"
          .venv/bin/python -c 'import base64, os, pathlib; pathlib.Path(os.environ["RUNNER_TEMP"], "retro-data/stable/Breakout-Atari2600-v0/rom.a26").write_bytes(base64.b64decode(os.environ["BREAKOUT_ROM_BASE64"], validate=True))'
          repository="$(jq -r .repository validation/stable-retro-turbo.json)"
          revision="$(jq -r .revision validation/stable-retro-turbo.json)"
          git clone --quiet --filter=blob:none --no-checkout "$repository" "$RUNNER_TEMP/provider"
          git -C "$RUNNER_TEMP/provider" checkout --quiet --detach "$revision"

      - name: Run canonical sole-oracle gate
        run: |
          RETRO_DATA_PATH="$RUNNER_TEMP/retro-data" \
          make test-semantic-oracle \
            STABLE_RETRO_TURBO_REPO="$RUNNER_TEMP/provider" \
            ORACLE_CANDIDATE=checkout \
            ORACLE_RECEIPT="$RUNNER_TEMP/stable-retro-turbo-oracle.json"
          mkdir oracle-evidence
          cp "$RUNNER_TEMP/stable-retro-turbo-oracle.json" oracle-evidence/

      - name: Attest sole-oracle receipt
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: oracle-evidence/stable-retro-turbo-oracle.json

      - name: Upload sole-oracle receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stable-retro-turbo-oracle-${{ inputs.ref }}
          path: oracle-evidence/stable-retro-turbo-oracle.json
          if-no-files-found: error
          retention-days: 90
