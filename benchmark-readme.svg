<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1052" viewBox="0 0 800 1052" role="img" aria-labelledby="title description">
<title id="title">Environment throughput through the candidate peak</title>
<desc id="description">Paired horizontal bars use one linear scale from zero. Every measured count through the first candidate throughput maximum is shown. Later counts remain in the complete benchmark proof. Speedup uses paired candidate/upstream ratios. Exact values and uncertainty remain in the benchmark report.</desc>
