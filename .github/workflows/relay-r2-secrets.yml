name: Relay protected R2 credentials

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  relay:
    runs-on: ubuntu-24.04
    environment: oracle
    steps:
      - name: Copy credentials to StableRetro parity environment
        env:
          GH_TOKEN: ${{ secrets.TARGET_GH_TOKEN }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          test -n "$R2_ACCESS_KEY_ID"
          test -n "$R2_SECRET_ACCESS_KEY"
          printf '%s' "$R2_ACCESS_KEY_ID" |
            gh secret set R2_ACCESS_KEY_ID \
              --env parity --repo tsilva/env-StableRetro-turbo
          printf '%s' "$R2_SECRET_ACCESS_KEY" |
            gh secret set R2_SECRET_ACCESS_KEY \
              --env parity --repo tsilva/env-StableRetro-turbo
