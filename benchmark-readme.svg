<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1372" viewBox="0 0 800 1372" role="img" aria-labelledby="title description">
<title id="title">Environment throughput through the candidate peak</title>
<desc id="description">Paired horizontal bars use one linear scale from zero. Every measured count through the first candidate throughput maximum is shown. Later counts remain in the complete benchmark proof. Speedup and 95% intervals use paired candidate/upstream ratios.</desc>
<rect width="100%" height="100%" fill="#0d1117"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#f0f3f6">
<text x="32" y="55" font-size="38" font-weight="700">Scaling to peak throughput</text>
<text x="32" y="98" font-size="26">Environment steps / second · higher is faster</text>
<rect x="32" y="121" width="22" height="22" fill="#acbde1"/><text x="66" y="141" font-size="28" fill="#acbde1">Stable Retro 1.0.1</text>
<rect x="32" y="162" width="22" height="22" fill="#ffcc22"/><text x="66" y="182" font-size="28" fill="#ffcc22">BreakoutAtari2600-turbo 0.5.15</text>
<text x="32" y="219" fill="#acbde1" font-size="24">Both bars use the same linear scale, starting at zero</text>
<text x="36.000" y="258" text-anchor="middle" font-size="23" fill="#acbde1">0</text>
<text x="209.333" y="258" text-anchor="middle" font-size="23" fill="#acbde1">200k</text>
<text x="382.667" y="258" text-anchor="middle" font-size="23" fill="#acbde1">400k</text>
<text x="556.000" y="258" text-anchor="middle" font-size="23" fill="#acbde1">600k</text>
<text x="768" y="258" text-anchor="end" font-size="23" fill="#acbde1">Median SPS</text>
